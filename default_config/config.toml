# Where compliance outcomes go: "None" (standalone, only logged) or "Regency"
# (pushed to regency's endpoint, configured in [Regency] below). Top-level key:
# it must stay before the first [Section].
Reporting = "None"

[Git]
# repo = "https://my.git.server/my/git/repository.git"
branch = "main"
local_path = "/home/regops/repo"
expected_state_path = "expected_state.yaml"

[SystemIntegration]
log_level = "Info"
log_format = "Raw"

[Behavior]
mode = "Assess"
interval_sec = 30
# Set to true to enable self-update: the agent periodically checks GitHub
# releases and installs newer versions of itself, then restarts.
# When true, an [AutoUpdate] section must be present below.
auto_update = false

# Host lock, shared with every other Regent process working on this host (e.g.
# remote runners): assessments run in parallel, a remediation runs alone.
# Defaults shown; the path must be the same for every process.
# [HostLock]
# enabled = true
# path = "/dev/shm/regent.lock"
# shared_timeout_sec = 60
# exclusive_timeout_sec = 300

# [AutoUpdate]
# github_api_url = "https://api.github.com/repos/regent-project/regops/releases/latest"
# check_interval_sec = 3600
# package_format = "Auto"
# Reporting to regency (used when Reporting = "Regency").
# [Regency]
# endpoint = "https://regency.example.com:8443"
# # CA certificate(s), PEM, of the endpoint's server certificate
# ca_cert_path = "/etc/regops/regency-ca.pem"
# # TLS name in the endpoint's certificate (default: the endpoint URL's host)
# server_name = "regency.example.com"
# # Default: hostname. Must equal this host's id in regency inventories (valid DNS name)
# host_id = "web-01"
# # ExternalCa: your PKI issues cert_path/key_path
# # BuiltInCa: enrolled once with the token in enrollment_token_path, renewed automatically
# # SelfSigned: generated by regops; approve the logged fingerprint in regency
# tls_mode = "ExternalCa"
# cert_path = "/var/lib/regops/regency/client.pem"
# key_path = "/var/lib/regops/regency/client.key"
# enrollment_token_path = "/etc/regops/regency-enrollment.token"
# renew_before_sec = 604800
# # Outcomes wait here until the endpoint accepted them (oldest dropped beyond the bound)
# spool_dir = "/var/lib/regops/spool"
# spool_max_entries = 1000
# retry_interval_sec = 30
# request_timeout_sec = 10
# # Live view: stream each pass to regency while it runs (best effort)
# live = true
# # Log of each pass sent with its outcome (bytes, estimate; 0 = none); regency
# # may crop it further to its own "run log" setting
# run_log_max_bytes = 1048576
# # Labels of this host: regency puts it in the inventories they select
# labels = { env = "prod", role = "web" }
