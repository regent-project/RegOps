[Git]
# repo = "https://my.git.server/my/git/repository.git"
branch = "main"
local_path = "/home/regops/repo"
expected_state_path = "expected_state.yaml"

[SystemIntegration]
log_level = "Info"
log_format = "Raw"

[Behavior]
mode = "Assess"
interval_sec = 30
# Set to true to enable self-update: the agent periodically checks GitHub
# releases and installs newer versions of itself, then restarts.
# When true, an [AutoUpdate] section must be present below.
auto_update = false

