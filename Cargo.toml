[package]
name = "regops"
version = "0.14.0"
edition = "2024"
authors     = ["Romain SUZANNE <romzorus591@gmail.com>"]
repository  = "https://github.com/regent-project/regops.git"
license     = "Apache-2.0"
description = "GitOps agent for localhost configuration management"
keywords    = ["automation", "configuration", "management", "infrastructure", "observability"]
categories  = ["config"]

[dependencies]
gix = { version = "0.90.0", features = ["blocking-network-client", "blocking-http-transport-reqwest", "blocking-http-transport-reqwest-rust-tls"] }
hostname = "0.4.2"
regent-sdk = { version = "0.21.0", features = ["grpc"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "registry", "json", "env-filter"] }
yaml_serde = "0.10.7"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0"
semver = "1.0"
# Reporting to regency (gRPC over mTLS)
tonic = { version = "0.14", default-features = false, features = ["channel", "tls-aws-lc"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto", "pem", "x509-parser"] }
x509-parser = "0.18"
sha2 = "0.11"
chrono = "0.4"

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }

[profile.release]
lto = true


[package.metadata.deb]
maintainer = "Romain SUZANNE <romzorus591@gmail.com>"
maintainer-scripts = "debian/"
copyright = "2026, Romain SUZANNE <romzorus591@gmail.com>"
license-file = ["LICENSE"]
conf-files = ["/etc/regops/config.toml"]
extended-description = """\
 GitOps agent for localhost configuration management"""
depends = "$auto, systemd, sudo"
section = "utility"
priority = "optional"
assets = [
    ["target/release/regops", "usr/bin/regops", "755"],
    ["systemd/regops.service", "lib/systemd/system/regops.service", "644"],
    ["default_config/config.toml", "etc/regops/config.toml", "644"]
]

[package.metadata.generate-rpm]
release = "1"
assets = [
    { source = "target/release/regops", dest = "/usr/bin/regops", mode = "755" },
    { source = "systemd/regops.service", dest = "/usr/lib/systemd/system/regops.service", mode = "644" },
    { source = "default_config/config.toml", dest = "/etc/regops/config.toml", mode = "644", config = "noreplace" },
    { source = "LICENSE", dest = "/usr/share/doc/regops/LICENSE", mode = "644", doc = true },
]
post_install_script = "rpm/postinst"
pre_uninstall_script = "rpm/preun"
post_uninstall_script = "rpm/postun"

[package.metadata.generate-rpm.requires]
systemd = "*"
sudo = "*"
